<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Каталог книг</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <a href="/" class="active">Каталог</a>
    <a href="/about">О себе</a>
  </nav>

  <main>
    <h1>Каталог книг</h1>

    <form id="filter-form" class="filter-form">
      <input type="text" id="author-input" placeholder="Автор (например, Tolstoy)">
      <input type="number" id="year-input" placeholder="Год (например, 1869)">
      <button type="submit">Найти</button>
      <button type="button" id="reset-btn" class="secondary">Сбросить</button>
    </form>

    <p id="books-status" class="status">Загрузка...</p>
    <div id="books-grid" class="books-grid"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
